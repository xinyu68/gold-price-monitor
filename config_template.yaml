# 金价推送工具配置文件
# 复制此文件为 config.yaml 并填入你的真实 Token

# 金十数据 MCP 配置
# 获取方式：注册金十数据账号后获取 MCP Bearer Token
jin10:
  url: "https://mcp.jin10.com/mcp"
  token: "sk-你的金十数据Token"

# Bark 推送配置
# 获取方式：安装 Bark App 后复制推送 Key
bark:
  key: "你的Bark推送Key"

# 监控配置
monitor:
  # 品种代码（可选值见下方表格）
  quote_code: "CZBJCJ"

  # 突破阈值（0.01 = 1%）— 无趋势时，价格相对基准涨/跌超过此值 → 进入趋势，触发突破告警
  breakout_threshold: 0.01

  # 回调/反弹阈值（0.01 = 1%）— 趋势中，价格从极值（peak/valley）反向运动超过此值 → 触发回调/反弹告警并退出趋势
  reversal_threshold: 0.01

  # 里程碑台阶（0.01 = 1%）— 趋势内每跨过一个新整数台阶推一次"持续上涨/下跌"
  milestone_step: 0.01

  # 震荡盘整告警波幅阈值（0.02 = 2%）— 无趋势时，滚动窗口内 (max-min)/min 超过此值才触发，独立类型兜底
  volatility_amplitude: 0.02

  # 震荡窗口采样数 — 滚动窗口大小，窗口越大波幅越平滑
  volatility_window: 10

  # 同类告警冷却分钟 — 震荡盘整告警在此分钟内不重复触发
  cooldown_minutes: 10

  # 向后兼容：若仅提供 threshold 字段（旧配置），则自动作为 breakout/reversal/milestone 的默认值

# 代理配置（可选）
# Bark 的 api.day.app 需要代理访问，建议开启
proxy:
  enabled: true
  address: "http://127.0.0.1:7897"

# ====== 常用品种代码 ======
#
# 积存金（人民币/克）:
#   CZBJCJ     浙商积存金
#   ICBCRYJCJ   工行如意积存金
#   ZHJCJ       招行积存金
#   CMBCJCJ     民生积存金
#   ICBCJCJ     工行积存金
#
# 现货贵金属（美元/盎司）:
#   XAUUSD      现货黄金
#   XAGUSD      现货白银
#   XPTUSD      现货铂金
#   XPDUSD      现货钯金
#
# 大宗商品:
#   USOIL       WTI 原油
#   UKOIL       布伦特原油
#   COPPER      现货铜
#
# 外汇:
#   EURUSD      欧元/美元
#   GBPUSD      英镑/美元
#   USDJPY      美元/日元
#   USDCNH      美元/人民币
